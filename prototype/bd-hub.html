<title>Quandel BD Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=Public+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an operating tool in Quandel colors. Sticky branded header + tabs; dense list/board views;
   records open in a right-hand drawer; forms open in a modal. Company colors tag every record. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#E7ECF2; --line:#D2DAE4; --ink:#12253D; --muted:#5A6A7D;
  --brand:#0063A8; --brand-ink:#FFFFFF; --brand-soft:#DCEAF6; --gold:#F8BE13; --gold-ink:#3A2B00; --gold-soft:#FDF0C8; --sky:#94D5EB;
  --ok:#2C7A4B; --ok-soft:#DCEFE3; --warn:#8A5D00; --warn-soft:#FBEFC8; --bad:#B23A2C; --bad-soft:#F8DCD7;
  --c-qcg:#0063A8; --c-qes:#2C7A4B; --c-pcs:#B5651D; --c-jvs:#7B4FB0; --c-pyr:#0E8A8A; --c-ent:#6B7684;
  --e-grant:#C99400; --e-bid:#0063A8; --e-board:#7B4FB0; --e-step:#0E8A8A; --e-next:#2C7A4B;
  --f-display:"Oswald","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C141E; --surface:#13202F; --sunken:#09101A; --line:#24364C; --ink:#E3EAF2; --muted:#93A4B8;
  --brand:#5AAAE8; --brand-ink:#08131F; --brand-soft:#16314C; --gold:#F8C53A; --gold-ink:#2A1F00; --gold-soft:#3A2E0E; --sky:#94D5EB;
  --ok:#6CC48F; --ok-soft:#173326; --warn:#E5BD52; --warn-soft:#352B10; --bad:#F08A7C; --bad-soft:#3B1D19;
  --c-qcg:#5AAAE8; --c-qes:#6CC48F; --c-pcs:#E39A5A; --c-jvs:#B994E0; --c-pyr:#4FC9C9; --c-ent:#9AA6B3;
  --e-grant:#F8C53A; --e-bid:#5AAAE8; --e-board:#B994E0; --e-step:#4FC9C9; --e-next:#6CC48F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C141E; --surface:#13202F; --sunken:#09101A; --line:#24364C; --ink:#E3EAF2; --muted:#93A4B8;
  --brand:#5AAAE8; --brand-ink:#08131F; --brand-soft:#16314C; --gold:#F8C53A; --gold-ink:#2A1F00; --gold-soft:#3A2E0E; --sky:#94D5EB;
  --ok:#6CC48F; --ok-soft:#173326; --warn:#E5BD52; --warn-soft:#352B10; --bad:#F08A7C; --bad-soft:#3B1D19;
  --c-qcg:#5AAAE8; --c-qes:#6CC48F; --c-pcs:#E39A5A; --c-jvs:#B994E0; --c-pyr:#4FC9C9; --c-ent:#9AA6B3;
  --e-grant:#F8C53A; --e-bid:#5AAAE8; --e-board:#B994E0; --e-step:#4FC9C9; --e-next:#6CC48F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:.01em}
a{color:var(--brand)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--brand) 0 72%,var(--gold) 72% 94%,var(--sky) 94%)}
.hrow{display:flex;align-items:center;gap:14px;padding-block:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{background:#FFFFFF;border-radius:6px;padding:4px 7px;display:flex;align-items:center;box-shadow:0 0 0 1px var(--line)}
.logo img{height:30px;width:auto;display:block}
.brand h1{font-size:21px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.brand .sub{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
nav.tabs a{padding:8px 11px 9px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;font-size:13.5px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs a .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;font-weight:400}
nav.tabs a .n.alert{color:var(--bad);font-weight:600}
main{padding-block:18px 70px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select{max-width:min(260px,100%)}
.toolbar select,.toolbar input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px;max-width:100%}
.toolbar input[type=search]{min-width:200px;flex:0 1 300px;border-radius:999px;padding-inline:12px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead>div:first-child{flex:1;min-width:220px}
.pagehead h2{font-size:26px;font-weight:600}
.pagehead p{margin:2px 0 0;color:var(--muted);max-width:75ch}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.info{background:var(--brand-soft);border-color:transparent}
.banner b{font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.gold{background:var(--gold);color:var(--gold-ink)}
.chip.practice{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.co{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:3px;color:#fff;letter-spacing:.03em}
.co.lead{box-shadow:0 0 0 2px var(--surface),0 0 0 3px currentColor}
.co.QCG{background:var(--c-qcg)}.co.QES{background:var(--c-qes)}.co.PCS{background:var(--c-pcs)}.co.JVS{background:var(--c-jvs)}.co.PYR{background:var(--c-pyr)}.co.ENT{background:var(--c-ent)}
:root[data-theme="dark"] .co{color:#0B1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .co{color:#0B1520}}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunken);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
tr.grp td{background:var(--sunken);font-family:var(--f-display);font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding-block:6px}
.t-name{font-weight:700}
/* KPI tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
a.stat:hover{border-color:var(--brand)}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.05}
.stat span{color:var(--muted);font-size:12.5px}
.stat.alert{border-color:var(--bad);background:var(--bad-soft)}
.stat.alert b{color:var(--bad)}
/* Home */
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h h3{font-size:18px;flex:1}
ul.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.rows li{border-top:1px solid var(--line);padding:8px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
ul.rows li:first-child{border-top:0}
ul.rows li .main{min-width:0;flex:1}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--brand);text-decoration:underline}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
/* Pipeline */
.lanes-scroll{overflow-x:auto;padding-bottom:8px}
.lanes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;min-width:min-content}
.lane{background:var(--sunken);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.lane.over{outline:2px dashed var(--brand)}
.lane-h{display:flex;align-items:baseline;gap:6px;padding:2px 4px 0}
.lane-h h3{font-size:15px}
.lane-h .step{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lane-h .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lane-sub{color:var(--muted);font-size:11px;padding:0 4px;display:flex;justify-content:space-between;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.card:hover{border-color:var(--brand)}
.card .t{font-weight:700;line-height:1.3}
.card .o{color:var(--muted);font-size:12px}
.card .row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(8,16,26,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;gap:10px;align-items:flex-start;padding:14px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--brand)}
.drawer-h .ttl{flex:1;min-width:0}
.drawer-h h2{font-size:23px;overflow-wrap:anywhere}
.dtabs{display:flex;gap:2px;overflow-x:auto;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.dtabs button{border:0;background:none;padding:8px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.dtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.drawer-b{overflow-y:auto;padding:16px 18px 50px;display:flex;flex-direction:column;gap:16px}
.blk{display:flex;flex-direction:column;gap:8px}
.blk-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.blk-h h3{font-size:17px;flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.facts div{min-width:0}
.facts .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts .v{overflow-wrap:anywhere}
.conf{color:var(--warn);font-family:var(--f-mono);font-size:12px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.stepper button.past{color:var(--ink)}
.stepper button.cur{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.ck{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:5px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck input{width:16px;height:16px;margin-top:2px;accent-color:var(--brand)}
.ck.done span{color:var(--muted);text-decoration:line-through}
.inl{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:4px 6px;max-width:100%}
.inl.num{font-family:var(--f-mono);text-align:right;width:130px}
.stackbar{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--sunken);border:1px solid var(--line)}
.stackbar i{display:block;height:100%;border-right:1px solid var(--surface)}
.stackbar i.gap{background:repeating-linear-gradient(45deg,var(--bad-soft) 0 6px,transparent 6px 12px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.total{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.total div{display:flex;flex-direction:column}
.total b{font-family:var(--f-display);font-size:22px;font-weight:600}
.dm{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.dm-col{background:var(--sunken);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dm-col h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:2px 4px}
.dm-card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:12.5px;cursor:pointer;text-align:left}
.dm-card:hover{border-color:var(--brand)}
.dm-card .inf{color:var(--muted);font-size:11.5px;margin-top:3px}
.str{font-family:var(--f-mono);font-size:11px;color:var(--gold-ink);background:var(--gold-soft);border-radius:3px;padding:0 4px}
/* Calendar */
.cal-day{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cal-day:first-child{border-top:0}
.cal-day .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.cal-day .d b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;font-weight:500}
.cal-ev{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:2px 0}
.cal-ev .ty{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.today-mark{outline:2px solid var(--gold);outline-offset:4px;border-radius:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="false"]{opacity:.5}
/* Training */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.scard.done{box-shadow:inset 3px 0 0 var(--ok)}
.scard .top{display:flex;align-items:baseline;gap:10px}
.scard .num{font-family:var(--f-display);font-size:26px;font-weight:600;color:var(--brand);line-height:1;min-width:40px}
.scard h3{font-size:16.5px}
.scard .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto}
.progress{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--ok)}
.hbar{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--sunken);min-width:120px}
.hbar i{display:block;height:100%}
/* Modal */
.modal{position:fixed;z-index:51;inset:auto 0 0 0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:12px 12px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.modal{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(720px,94vw);border-radius:10px;max-height:90vh}}
.modal h2{font-size:21px;margin-bottom:4px}
.modal .note{color:var(--muted);margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form .sect{grid-column:1/-1;font-family:var(--f-display);font-size:15px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 8px;color:var(--ink);font-size:14px;width:100%;font-weight:400}
.form textarea{min-height:64px;resize:vertical}
.form .cbx{display:flex;flex-wrap:wrap;gap:6px 12px;padding:6px 0;max-height:170px;overflow-y:auto}
.form .cbx label{flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-size:13px;font-weight:400}
.form .cbx input,.form .inline input{width:auto}
.form .inline{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px;font-weight:500}
.form .hint{font-weight:400;font-size:11.5px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);z-index:60;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
@media (max-width:640px){.brand .sub{display:none}.pagehead h2{font-size:22px}}
</style>

<header>
  <div class="wrap">

function stackCalc(o){const rows=arr(o.stack);const cost=num(o.estimated_value)||0;
  const live=rows.filter(r=>r.status!=='denied');const total=live.reduce((a,r)=>a+(num(r.amount)||0),0);
  const match=rows.filter(r=>r.program_id&&S.programs[r.program_id]).map(r=>{const p=S.programs[r.program_id];const pct=num(p.match_pct);
    if(pct==null)return {r,p,state:'unknown'};const basis=p.match_basis==='of award'?(num(r.amount)||0):cost;const need=pct/100*basis;const other=total-(r.status==='denied'?0:(num(r.amount)||0));
    return {r,p,need,other,state:other>=need?'met':'short',short:need-other}});
  const reimb=rows.filter(r=>r.program_id&&S.programs[r.program_id]&&S.programs[r.program_id].reimbursement==='Yes'&&r.status!=='denied');
  const cf=reimb.reduce((a,r)=>a+(num(r.amount)||0),0);const lag=reimb.length?Math.max(...reimb.map(r=>num(r.lag)||0)):0;
  return {rows,cost,total,gap:cost-total,match,cf,lag}}
/* Meeting pattern: weeks (1-4, 5 = last) + weekday */
function meetingsIn(org,y,m){const wd=org.meet_day==null||org.meet_day===''?null:+org.meet_day;const wks=arr(org.meet_weeks).map(Number);if(wd==null||!wks.length)return [];
  const out=[];const first=new Date(y,m,1);let d=1+((wd-first.getDay()+7)%7);const all=[];while(d<=new Date(y,m+1,0).getDate()){all.push(d);d+=7}
  wks.forEach(w=>{const day=w===5?all[all.length-1]:all[w-1];if(day)out.push(iso(new Date(y,m,day)))});return out.sort()}
function meetingsBetween(org,from,to){const out=[];let d=parseD(from);d.setDate(1);const end=parseD(to);while(d<=end){out.push(...meetingsIn(org,d.getFullYear(),d.getMonth()));d.setMonth(d.getMonth()+1)}return out.filter(x=>x>=from&&x<=to)}
function latestMeetingBefore(org,date){const list=meetingsBetween(org,addDays(date,-400),date).filter(x=>x<=date);return list.length?list[list.length-1]:null}
function patternText(org){const wd=org.meet_day;const w=arr(org.meet_weeks).map(Number).sort();if(wd==null||wd===''||!w.length)return '';const ord={1:'1st',2:'2nd',3:'3rd',4:'4th',5:'last'};return w.map(x=>ord[x]).join(' and ')+' '+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][+wd]}
function backSchedule(o,deadline){const org=orgOf(o)||{};const steps=arr(o.approvals).map(s=>({...s}));const warn=[];let cursor=deadline;const hasPattern=patternText(org)!=='';
  if(!hasPattern)warn.push('This owner has no meeting pattern, so board steps use the plain lead time. Add it on the account (e.g., 2nd and 4th Tuesday).');
  let next=null;for(let i=steps.length-1;i>=0;i--){const s=steps[i];let buf=num(s.lead)||1;if(s.gapRule){const g=ruleVal(s.gapRule);if(g==null)warn.push(`Rule ${s.gapRule} is missing from State rules; no waiting period applied.`);else buf=g}
    const latest=next==null?deadline:addDays(next,-buf);
    s.date=(s.meeting&&hasPattern)?(latestMeetingBefore(org,latest)||latest):latest;
    if(s.meeting&&hasPattern&&num(org.agenda_days))s.agenda=addDays(s.date,-num(org.agenda_days));else delete s.agenda;
    if(s.date<TODAY)warn.push(`"${s.label}" lands in the past (${fmtD(s.date)}). The deadline may be too close.`);
    next=s.date}
  return {steps,warn}}

const EV={grant:['Grant deadline','var(--e-grant)'],bid:['Bid / procurement','var(--e-bid)'],board:['Board meeting','var(--e-board)'],step:['Approval step','var(--e-step)'],next:['Next step','var(--e-next)']};
function calEvents(from,to){const ev=[];const inR=d=>d&&d>=from&&d<=to;
  L('programs').forEach(p=>{if(inR(p.next_deadline))ev.push({date:p.next_deadline,type:'grant',title:p.name+' deadline',sub:p.state||'',act:'editProg',id:p.id})});
  L('opps').forEach(o=>{const org=orgOf(o)||{};KEYDATES.forEach(([k,l])=>{const d=(o.dates||{})[k];if(inR(d))ev.push({date:d,type:'bid',title:`${l}: ${o.name}`,sub:org.name||'',act:'openOpp',id:o.id})});
    arr(o.approvals).forEach(s=>{if(inR(s.date)&&s.status!=='done')ev.push({date:s.date,type:'step',title:s.label,sub:`${o.name}${s.agenda?' · agenda due '+fmtDs(s.agenda):''}`,act:'openOpp',id:o.id})})});
  const active=new Set(L('opps').filter(o=>+o.stage<9).map(o=>o.org_id));L('orgs').filter(o=>active.has(o.id)||o.tier==='A').forEach(o=>meetingsBetween(o,from,to).forEach(d=>ev.push({date:d,type:'board',title:`${o.governing_body||'Board'} meeting`,sub:o.name,act:'openOrg',id:o.id})));
  L('acts').forEach(a=>{if(inR(a.next_step_date)&&!a.next_done)ev.push({date:a.next_step_date,type:'next',title:a.next_step,sub:(S.orgs[a.org_id]||{}).name||'',act:'openOrg',id:a.org_id})});
  return ev.map(e=>({...e,color:EV[e.type][1]})).sort((a,b)=>a.date.localeCompare(b.date))}

  if(tab==='docs')body=`<div class="blk-h"><h3>Documents</h3><button class="btn small primary" data-act="addDoc" data-id="${esc(o.id)}">Add document link</button></div><p class="small muted" style="margin:0">RFPs, capital plans, minutes, resolutions, audits, award letters. Anything we send may be a public record.</p>${arr(o.docs).length?`<ul class="rows panel">${arr(o.docs).map((x,i)=>`<li><div class="main"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="small muted">${esc(x.doc_type||'')} · ${esc(x.public||'public record status not set')}</div></div><button class="btn small ghost danger" data-act="delDoc" data-id="${esc(o.id+'|'+i)}">Remove</button></li>`).join('')}</ul>`:''}`;
  return `<div class="drawer-h"><div class="ttl"><div class="eyebrow">Account · ${esc(o.org_type||'')}</div><h2>${esc(o.name)}${practiceChip(o)}</h2><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${coTags(o.company_tags)}${o.tier?`<span class="chip ${o.tier==='A'?'gold':''}">Tier ${esc(o.tier)}</span>`:''}<span class="chip">${esc(o.status||'')}</span></div></div><button class="btn small" data-act="editOrg" data-id="${esc(o.id)}">Edit</button><button class="btn small ghost" data-act="closeDrawer" aria-label="Close">✕</button></div>
  <div class="dtabs">${tabs.map(([k,l])=>`<button aria-pressed="${tab===k}" data-act="dtab" data-id="${k}">${l}</button>`).join('')}</div><div class="drawer-b">${body}</div>`}

function oppDrawer(d){const o=S.opps[d.id];if(!o)return null;const org=orgOf(o)||{};const tab=d.tab||'summary';const st=+o.stage||1;
  const tabs=[['summary','Summary'],['stack','Capital stack'],['approvals','Approvals · '+arr(o.approvals).length],['procurement','Procurement'],['energy','Energy check'],['compliance','Compliance · '+oppFlags(o).length]];
  let body='';const sg=suggest(o);
  const banner=isJointQES(o)?`<div class="banner ${o.disclosure_ack?'info':'warn'}"><b>Related-company disclosure.</b> QES and a Quandel construction company both touch this owner. The owner must know about the related-company role and decide whether one team is acceptable. ${o.disclosure_ack?`Recorded: <b>${esc(o.disclosure_ack)}</b>.`:'<button class="btn small" data-act="discl">Record owner decision</button>'}</div>`:'';
  if(tab==='summary'){const ck=DEL[o.delivery_method]?.ck;const items=CHECKS[ck]||[];
    body=`${banner}<div class="blk"><div class="blk-h"><h3>Stage</h3><span class="muted small">entered ${fmtD((o.stage_entered_at||'').slice(0,10))}</span></div><div class="stepper">${STAGES.map(([n,name])=>`<button class="${n<st?'past':n===st?'cur':''}" data-act="setStage" data-id="${n}" title="${esc(STAGES[n-1][2])}">${n} ${name}</button>`).join('')}</div><div class="small muted">Exit criteria: ${esc(STAGES[st-1][2])}</div>
     ${st===9?`<div class="toolbar" style="margin:0"><span class="small">Outcome</span><select id="o_outcome" data-chg="oppField" data-id="outcome">${selectOpts(['Won','Lost','No-bid'],o.outcome,'Choose')}</select><input id="o_loss" class="inl" style="flex:1;min-width:180px" placeholder="Reason (required for Lost / No-bid)" value="${esc(o.loss_reason||'')}" data-chg="oppField" data-id="loss_reason"></div>`:''}</div>
    <div class="panel"><div class="facts">${fact('Owner',`<button class="linkbtn" data-act="openOrg" data-id="${esc(org.id||'')}">${esc(org.name||'—')}</button> ${esc(org.state||'')}`)}${fact('Project type',esc(o.project_type||'—'))}${fact('Delivery method',esc(DEL[o.delivery_method]?.label||'—'))}${fact('Estimated value',money(num(o.estimated_value)))}${fact('Quandel scope',money(num(o.quandel_scope_value)))}${fact('Probability',(num(o.probability)??'—')+'%')}${fact('Weighted',money(weighted(o)))}${fact('Go / no-go',o.go_no_go?`<span class="chip ${o.go_no_go==='Go'?'ok':o.go_no_go==='No-go'?'bad':''}">${esc(o.go_no_go)}</span> ${esc(o.gng_approver||'')}<div class="small muted">${esc(o.gng_reason||'')}</div>`:'<span class="muted">not decided</span>')}${fact('Competitors',esc(o.competitors||'—'))}${fact('Win themes',esc(o.win_themes||'—'))}</div></div>
    <div class="blk"><div class="blk-h"><h3>Team</h3></div><div class="panel" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="small">Lead</span>${o.lead_company?coTag(o.lead_company,true):'<span class="muted">none</span>'}<span class="small">Support</span>${coTags(o.support_companies)||'<span class="muted">none</span>'}
     ${sg.s.length&&sg.s.some(c=>!oppCos(o).includes(c))?`<span class="spacer"></span><span class="chip brand" title="${esc(sg.why.join('; '))}">Routing suggests ${sg.s.join(' + ')}</span><button class="btn small" data-act="applyRoute">Apply</button>`:''}</div></div>
    <div class="blk"><div class="blk-h"><h3>Key dates</h3></div><div class="panel"><div class="facts">${KEYDATES.map(([k,l])=>`<div><div class="k">${l}</div><input type="date" class="inl" id="kd_${k}" value="${esc((o.dates||{})[k]||'')}" data-chg="oppDate" data-id="${k}"></div>`).join('')}</div></div></div>
    ${items.length?`<div class="blk"><div class="blk-h"><h3>${esc(DEL[o.delivery_method].label)} checklist</h3><span class="mono small">${items.filter(i=>(o.checks||{})[i]).length}/${items.length}</span></div><div class="panel">${items.map((i,ix)=>`<label class="ck ${(o.checks||{})[i]?'done':''}"><input type="checkbox" id="ck_${ix}" data-chg="oppCheck" data-id="${esc(i)}" ${(o.checks||{})[i]?'checked':''}><span>${esc(i)}</span></label>`).join('')}</div></div>`:''}`}
  if(tab==='stack'){const c=stackCalc(o);const progs=L('programs').sort((a,b)=>(a.state||'').localeCompare(b.state||'')||a.name.localeCompare(b.name));
    const segs=c.rows.filter(r=>r.status!=='denied'&&num(r.amount)>0);const denom=Math.max(c.cost,c.total)||1;
    body=`<div class="total"><div><span class="eyebrow">Project cost</span><b>${money(c.cost)}</b></div><div><span class="eyebrow">Sources</span><b>${money(c.total)}</b></div><div><span class="eyebrow">${c.gap>0?'Gap':'Over-funded'}</span><b style="color:${c.gap>0?'var(--bad)':'var(--ok)'}">${money(Math.abs(c.gap))}</b></div>${c.cf?`<div><span class="eyebrow">Reimbursement cash flow</span><b>${money(c.cf)}</b><span class="small muted">fronted up to ${c.lag} days</span></div>`:''}</div>
    <div class="stackbar" role="img" aria-label="Capital stack by source">${segs.map(r=>`<i style="width:${num(r.amount)/denom*100}%;background:${STACK_COLORS[r.status||'idea']}" title="${esc(srcName(r))}: ${money(num(r.amount))} (${esc(r.status)})"></i>`).join('')}${c.gap>0?`<i class="gap" style="width:${c.gap/denom*100}%" title="Gap ${money(c.gap)}"></i>`:''}</div>
    <div class="legend">${STACK_STATUS.map(s=>`<span><span class="dot" style="background:${STACK_COLORS[s]}"></span>${s}</span>`).join('')}<span><span class="dot" style="background:var(--bad-soft);outline:1px solid var(--bad)"></span>gap</span></div>
    ${c.cost?'':'<div class="banner warn">Set an estimated value on the opportunity to compute the gap.</div>'}
    <div class="tbl-wrap"><table><thead><tr><th>Source</th><th class="num">Amount</th><th>Status</th><th>Applied</th><th>Awarded</th><th class="num">Reimb. lag (days)</th><th></th></tr></thead><tbody>
    ${c.rows.map((r,i)=>`<tr><td>${r.program_id&&S.programs[r.program_id]?`<b>${esc(S.programs[r.program_id].name)}</b><div class="small muted">${esc(S.programs[r.program_id].state||'')} · ${esc(S.programs[r.program_id].program_type||'')}</div>`:`<input class="inl" id="sk_s${i}" value="${esc(r.other||'')}" list="srcs" data-chg="stackRow" data-id="${i}|other">`}</td><td class="num"><input class="inl num" id="sk_a${i}" inputmode="decimal" value="${esc(r.amount??'')}" data-chg="stackRow" data-id="${i}|amount"></td><td><select class="inl" id="sk_t${i}" data-chg="stackRow" data-id="${i}|status">${selectOpts(STACK_STATUS,r.status||'idea')}</select></td><td><input type="date" class="inl" id="sk_d${i}" value="${esc(r.app_date||'')}" data-chg="stackRow" data-id="${i}|app_date"></td><td><input type="date" class="inl" id="sk_w${i}" value="${esc(r.award_date||'')}" data-chg="stackRow" data-id="${i}|award_date"></td><td class="num"><input class="inl num" style="width:70px" id="sk_l${i}" value="${esc(r.lag??'')}" data-chg="stackRow" data-id="${i}|lag"></td><td><button class="btn small ghost danger" data-act="delStack" data-id="${i}" aria-label="Remove row">✕</button></td></tr>`).join('')||`<tr><td colspan="7" class="muted">No sources yet.</td></tr>`}
    </tbody></table></div><datalist id="srcs">${OTHER_SOURCES.map(s=>`<option value="${s}">`).join('')}</datalist>
    <div class="toolbar"><select id="addprog">${selectOpts(progs.map(p=>[p.id,(p.state||'')+' · '+p.name]),'','Add a program from the library…')}</select><button class="btn small" data-act="addStackProg">Add program</button><button class="btn small" data-act="addStackOther">Add other source</button><button class="btn small" data-act="stackTemplate">Illustrative template</button></div>
    <div class="blk"><div class="blk-h"><h3>Match check</h3></div>${c.match.length?`<div class="panel">${c.match.map(m=>`<div class="ck"><span class="chip ${m.state==='met'?'ok':m.state==='short'?'bad':'warn'}">${m.state==='met'?'Met':m.state==='short'?'Short':'No rule'}</span><span><b>${esc(m.p.name)}</b> — ${m.state==='unknown'?'match requirement not entered in the program library <span class="conf">[confirm]</span>':`needs ${money(m.need)} (${esc(m.p.match_pct)}% ${esc(m.p.match_basis||'of project cost')}); other sources ${money(m.other)}${m.state==='short'?` · short ${money(m.short)}`:''}`}</span></div>`).join('')}</div>`:'<p class="small muted" style="margin:0">Add a library program to check its match rule.</p>'}</div>`}
  if(tab==='approvals'){const tmpl=TEMPLATES[org.state]?org.state:null;const steps=arr(o.approvals);
    body=`<div class="blk"><div class="blk-h"><h3>Approvals timeline</h3><span class="muted small">${esc(org.governing_body||'Board')} meets ${esc(patternText(org)||'— (set on account)')}${org.agenda_days?` · agenda ${esc(org.agenda_days)} days ahead`:''}</span></div>
    <div class="toolbar" style="margin:0">${Object.keys(TEMPLATES).map(s=>`<button class="btn small ${s===tmpl?'primary':''}" data-act="loadTmpl" data-id="${s}">${steps.length?'Replace with':'Load'} ${s} template</button>`).join('')}<button class="btn small" data-act="addStep">Add step</button></div>
    <div class="panel" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>Backward scheduler</b><span class="small muted">Pick the deadline the last step must meet:</span><input type="date" class="inl" id="bs_dl" value="${esc(o.bs_deadline||'')}"><button class="btn small primary" data-act="backSched">Propose dates</button></div>
    ${d.warn?d.warn.map(w=>`<div class="banner warn small">${esc(w)}</div>`).join(''):''}
    ${steps.length?`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Step</th><th>Body · document</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${steps.map((s,i)=>`<tr><td class="mono">${i+1}</td><td><input class="inl" id="ap_l${i}" style="min-width:180px;width:100%" value="${esc(s.label)}" data-chg="apStep" data-id="${i}|label">${s.meeting?'<div class="small muted">board meeting'+(s.gapRule?` · then ${ruleVal(s.gapRule)??'?'} day wait (${esc(s.gapRule)})`:'')+'</div>':''}</td><td class="small">${esc(s.body||'')}<div class="muted">${esc(s.doc||'')}</div></td><td><input type="date" class="inl" id="ap_d${i}" value="${esc(s.date||'')}" data-chg="apStep" data-id="${i}|date">${s.agenda?`<div class="small muted">agenda due ${fmtDs(s.agenda)}</div>`:''}</td><td><select class="inl" id="ap_s${i}" data-chg="apStep" data-id="${i}|status">${selectOpts(['planned','scheduled','done'],s.status||'planned')}</select></td><td><button class="btn small ghost danger" data-act="delStep" data-id="${i}" aria-label="Remove step">✕</button></td></tr>`).join('')}</tbody></table></div>`:empty('No approval steps','Load the PA or NY template, then pick a deadline and let the scheduler propose meeting dates.')}</div>`}
  if(tab==='procurement'){body=`<div class="blk"><div class="blk-h"><h3>Procurement event</h3><button class="btn small" data-act="editProc">Edit</button></div><div class="panel"><div class="facts">${fact('Type',esc(o.proc_type||'—'))}${fact('Source',esc(o.proc_source||'—'))}${fact('Issued',fmtD((o.dates||{}).rfq))}${fact('Questions due',fmtD(o.q_due))}${fact('Due',fmtD((o.dates||{}).due))}${fact('Bond required',esc(o.bond_req||'—'))}${fact('Prevailing wage',esc(o.prev_wage||'—'))}${fact('MBE/WBE goals',esc(o.mbe||'—'))}${fact('Addenda',esc(o.addenda||'—'))}${fact('Result / bid tab',esc(o.bid_result||'—'))}</div></div></div>`}
  if(tab==='energy'){const pay=num(o.annual_payment),sav=num(o.guaranteed_savings),term=num(o.term_years);const st_=org.state;const max=st_==='PA'?ruleVal('PA.gesa_cost_test_years'):st_==='NY'?ruleVal('NY.epc_max_term_years'):null;const ne=num(o.non_energy_pct),neCap=st_==='PA'?ruleVal('PA.gesa_non_energy_cap_pct'):null;
    body=`<div class="blk"><div class="blk-h"><h3>Budget-neutral check</h3><button class="btn small" data-act="editEnergy">Edit inputs</button></div><p class="small muted" style="margin:0">Annual payments must not exceed guaranteed annual savings. Term and non-energy limits come from State rules.</p>
    <div class="panel"><div class="facts">${fact('Annual payment',money(pay))}${fact('Guaranteed annual savings',money(sav))}${fact('Term',term?term+' years':'—')}${fact('Non-energy share',ne!=null?ne+'%':'—')}${fact('Guarantee term',esc(o.guarantee_term||'—'))}${fact('IPMVP option',esc(o.ipmvp||'—'))}${fact('Financing rate',o.fin_rate?esc(o.fin_rate)+'%':'—')}</div></div>
    <div class="panel">${pay!=null&&sav!=null?`<div class="ck"><span class="chip ${pay<=sav?'ok':'bad'}">${pay<=sav?'Budget-neutral':'Not budget-neutral'}</span><span>Payments ${money(pay)} vs savings ${money(sav)} (${pay<=sav?'margin':'shortfall'} ${money(Math.abs(sav-pay))} a year)</span></div>`:'<p class="muted" style="margin:0">Enter payment and savings to run the check.</p>'}
    ${term&&max!=null?`<div class="ck"><span class="chip ${term<=max?'ok':'bad'}">${term<=max?'Within term':'Over term'}</span><span>${term} years vs ${st_} limit ${max} years</span></div>`:''}
    ${ne!=null&&neCap!=null?`<div class="ck"><span class="chip ${ne<=neCap?'ok':'bad'}">${ne<=neCap?'Within cap':'Over cap'}</span><span>Non-energy ${ne}% vs PA GESA cap ${neCap}% (§3754(d))</span></div>`:''}
    ${st_==='NY'&&org.org_type==='school district'?'<div class="ck"><span class="chip warn">Check</span><span>NY schools: SED approval required; see the 18-year payback rule in State rules.</span></div>':''}
    ${oppCos(o).includes('QES')?'':'<p class="small muted" style="margin:6px 0 0">This check is for QES energy opportunities.</p>'}</div></div>`}
  if(tab==='compliance'){const f=oppFlags(o);
    body=`${banner}<div class="blk"><div class="blk-h"><h3>Compliance check</h3></div><div class="panel">
    <div class="ck"><span class="chip ${o.helped_specs==='No'?'ok':o.helped_specs==='Yes'?'bad':'warn'}">${o.helped_specs||'?'}</span><span>Did we help write specs or scoring? <select class="inl" id="cc_hs" data-chg="oppField" data-id="helped_specs">${selectOpts(['No','Yes'],o.helped_specs,'Answer')}</select> <span class="small muted">Must be No to bid.</span></span></div>
    ${oppCos(o).includes('QES')?`<label class="ck ${o.proc_independence?'done':''}"><input type="checkbox" id="cc_pi" data-chg="oppBool" data-id="proc_independence" ${o.proc_independence?'checked':''}><span style="text-decoration:none;color:var(--ink)">Procurement independence (stage 5): QES did not write the owner's GESA/EPC RFP or scoring. ${o.proc_independence?`<span class="small muted">logged ${fmtDs(o.proc_independence.slice(0,10))} by ${esc(nm(o.proc_by))}</span>`:''}</span></label>`:''}
    ${org.state==='NY'&&org.org_type==='school district'?`<label class="ck"><input type="checkbox" id="cc_ae" data-chg="oppBool" data-id="ae_no_conflict" ${o.ae_no_conflict?'checked':''}><span style="text-decoration:none;color:var(--ink)">Architect/engineer of record no-conflict certification recorded (8 NYCRR §155.20)</span></label>`:''}
    <div class="ck"><span class="chip">Go/no-go</span><span>${o.go_no_go?esc(o.go_no_go)+' · '+esc(o.gng_approver||'no approver')+' · '+esc(o.gng_reason||''):'Not decided'} <button class="btn small" data-act="gng">Record decision</button></span></div>
    </div></div>${f.length?`<div class="blk"><div class="blk-h"><h3>Open flags</h3></div><div class="panel">${f.map(([s,t])=>`<div class="ck"><span class="chip ${s}">${s==='bad'?'Stop':'Check'}</span><span>${esc(t)}</span></div>`).join('')}</div></div>`:'<span class="chip ok">No open flags</span>'}
    <p class="small muted" style="margin:0">Proposals and emails may be public records (PA RTK, NY FOIL). Mark trade secrets on submission.</p>`}
  return `<div class="drawer-h"><div class="ttl"><div class="eyebrow">Opportunity · stage ${st} ${esc(STAGES[st-1][1])}</div><h2>${esc(o.name)}${practiceChip(o)}</h2><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${coTags(oppCos(o),o.lead_company)}<span class="muted small">${esc(org.name||'')}</span>${isJointQES(o)?'<span class="chip warn">joint pursuit · disclosure</span>':''}</div></div><button class="btn small" data-act="editOpp" data-id="${esc(o.id)}">Edit</button><button class="btn small ghost" data-act="closeDrawer" aria-label="Close">✕</button></div>
  <div class="dtabs">${tabs.map(([k,l])=>`<button aria-pressed="${tab===k}" data-act="dtab" data-id="${k}">${l}</button>`).join('')}</div><div class="drawer-b">${body}</div>`}
const srcName=r=>r.program_id&&S.programs[r.program_id]?S.programs[r.program_id].name:(r.other||'Other source');

/* ===================== Forms ===================== */
let FORM=null;
function openForm(cfg){FORM=cfg;const v=cfg.values||{};
  const field=f=>{if(f.sect)return `<div class="sect">${esc(f.sect)}</div>`;const id='f_'+f.k;const val=v[f.k];const lab=`${esc(f.label)}${f.req?' *':''}${f.hint?` <span class="hint">${esc(f.hint)}</span>`:''}`;const cls=f.full?' class="full"':'';
    if(f.type==='select')return `<label${cls}>${lab}<select id="${id}" name="${f.k}" ${f.req?'required':''}>${selectOpts(typeof f.opts==='function'?f.opts():f.opts,val,f.blank??'—')}</select></label>`;
    if(f.type==='multi')return `<div class="full"><span class="small muted" style="font-weight:600">${lab}</span><div class="cbx">${(typeof f.opts==='function'?f.opts():f.opts).map((o,i)=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<label><input type="checkbox" id="${id}_${i}" name="${f.k}" value="${esc(ov)}" ${arr(val).map(String).includes(String(ov))?'checked':''}> ${esc(ol)}</label>`}).join('')||'<span class="muted small">None available</span>'}</div></div>`;
    if(f.type==='textarea')return `<label class="full">${lab}<textarea id="${id}" name="${f.k}">${esc(val)}</textarea></label>`;
    if(f.type==='check')return `<label class="inline${f.full?' full':''}"><input type="checkbox" id="${id}" name="${f.k}" ${val?'checked':''}> ${lab}</label>`;
    return `<label${cls}>${lab}<input id="${id}" name="${f.k}" type="${f.type==='num'?'text':f.type||'text'}" ${f.type==='num'?'inputmode="decimal"':''} value="${esc(val)}" ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}></label>`};
  $('#modal-root').innerHTML=`<div class="scrim" data-act="closeForm" style="z-index:50"></div><form class="modal" id="theform" role="dialog" aria-modal="true" novalidate><h2>${esc(cfg.title)}</h2>${cfg.note?`<p class="note">${cfg.note}</p>`:''}<div class="form">${cfg.fields.map(field).join('')}</div>

ACT.capstone=()=>openForm({title:'Score a capstone team',note:'Stack 25 · approvals 20 · delivery 15 · need 15 · answers 15 · ethics 10. Any ethics violation = 0.',fields:[{k:'team',label:'Team',req:1,full:1},...RUBRIC.map(([k,l,m])=>({k,label:`${l} (0–${m})`,type:'num'})),{k:'violation',label:'Ethics violation',type:'check',full:1},{k:'notes',label:'Board feedback',type:'textarea'}],onSave:v=>{if(!v.team){toast('Name the team');return}save('reviews',null,{...v,kind:'capstone',score:capScore(v),by:ME});toast('Capstone scored: '+capScore(v)+'/100')}});
ACT.newGift=()=>{if(!attested()){toast('Sign the annual ethics attestation first');return}openForm({title:'Log gift or hospitality',fields:[{k:'date',label:'Date',type:'date',req:1},{k:'state',label:'Jurisdiction',type:'select',opts:STATES},{k:'recipient',label:'Recipient (name, organization)',full:1},{k:'value',label:'Value ($)',type:'num'},{k:'approver',label:'Approver'},{k:'description',label:'Description',type:'textarea'}],values:{date:TODAY,state:'PA'},onSave:v=>{save('comp',null,{...v,kind:'gift'});const gl=ruleVal('NY.gift_limit');toast(v.state==='NY'&&gl!=null&&num(v.value)>gl?`Logged. Over the NY $${gl} limit: flagged.`:'Logged')}})};
ACT.newLob=()=>{if(!attested()){toast('Sign the annual ethics attestation first');return}openForm({title:'Log lobbying',fields:[{k:'date',label:'Date',type:'date',req:1},{k:'state',label:'Jurisdiction',type:'select',opts:STATES},{k:'hours',label:'Hours',type:'num'},{k:'expenses',label:'Expenses ($)',type:'num'},{k:'description',label:'Who and what',type:'textarea'}],values:{date:TODAY,state:'NY'},onSave:v=>{save('comp',null,{...v,kind:'lobbying'});toast('Logged')}})};
ACT.editComp=el=>{const c=S.comp[el.dataset.id];if(!c)return;openForm({title:c.kind==='gift'?'Gift or hospitality':'Lobbying entry',fields:c.kind==='gift'?[{k:'date',label:'Date',type:'date'},{k:'state',label:'Jurisdiction',type:'select',opts:STATES},{k:'recipient',label:'Recipient',full:1},{k:'value',label:'Value ($)',type:'num'},{k:'approver',label:'Approver'},{k:'description',label:'Description',type:'textarea'}]:[{k:'date',label:'Date',type:'date'},{k:'state',label:'Jurisdiction',type:'select',opts:STATES},{k:'hours',label:'Hours',type:'num'},{k:'expenses',label:'Expenses ($)',type:'num'},{k:'description',label:'Who and what',type:'textarea'}],values:c,onSave:v=>{save('comp',c.id,v);toast('Saved')},onDelete:()=>{remove('comp',c.id);toast('Deleted')}})};
ACT.addDoc=el=>{const o=S.orgs[el.dataset.id];openForm({title:'Add document link',fields:[{k:'title',label:'Title',req:1,full:1},{k:'url',label:'Link',type:'url',req:1,full:1},{k:'doc_type',label:'Type',type:'select',opts:['RFP','proposal','capital plan','minutes','resolution','audit report','award letter','other']},{k:'public',label:'Public record status',type:'select',opts:['public record','trade secret marked','internal']}],onSave:v=>{if(!v.url){toast('Add a link');return}save('orgs',o.id,{docs:[...arr(o.docs),v]});toast('Document added')}})};
ACT.delDoc=el=>{const [id,i]=el.dataset.id.split('|');const o=S.orgs[id];const d=arr(o.docs).slice();d.splice(+i,1);save('orgs',id,{docs:d})};
ACT.clearPractice=el=>{if(!el.dataset.confirm){el.dataset.confirm='1';el.textContent='Click again to remove them';return}['orgs','contacts','opps','acts'].forEach(c=>L(c).filter(r=>r.practice).forEach(r=>remove(c,r.id)));toast('Practice records removed')};
ACT.exportCsv=async el=>{const c=el.dataset.id;const rows=L(c);if(!rows.length){toast('Nothing to export');return}const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>!['stack','approvals','checks','docs'].includes(k));
  const cell=v=>{v=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const csv=[keys.join(','),...rows.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\n');
  let dl=null;try{dl=await window.claude?.use?.('downloads')}catch(e){}if(!dl){toast('Downloads are not available in this view');return}try{await dl.save({filename:`bd-hub-${c}-${TODAY}.csv`,data:csv})}catch(e){if(e&&e.code!=='cancelled')toast('Export not saved')}};

/* change handlers (inline edits) */
const CHG={};
CHG.oppField=el=>{const o=S.opps[UI.drawer.id];save('opps',o.id,{[el.dataset.id]:el.value})};
CHG.oppBool=el=>{const o=S.opps[UI.drawer.id];const k=el.dataset.id;save('opps',o.id,k==='proc_independence'?{proc_independence:el.checked?new Date().toISOString():'',proc_by:el.checked?ME:''}:{[k]:el.checked})};
CHG.oppDate=el=>{const o=S.opps[UI.drawer.id];save('opps',o.id,{dates:{...(o.dates||{}),[el.dataset.id]:el.value}})};
CHG.oppCheck=el=>{const o=S.opps[UI.drawer.id];const c={...(o.checks||{})};if(el.checked)c[el.dataset.id]=TODAY;else delete c[el.dataset.id];save('opps',o.id,{checks:c})};
CHG.stackRow=el=>{const o=S.opps[UI.drawer.id];const [i,k]=el.dataset.id.split('|');const s=arr(o.stack).map(r=>({...r}));let v=el.value;if(k==='amount'||k==='lag')v=num(v)??'';s[+i][k]=v;save('opps',o.id,{stack:s})};
CHG.apStep=el=>{const o=S.opps[UI.drawer.id];const [i,k]=el.dataset.id.split('|');const s=arr(o.approvals).map(r=>({...r}));s[+i][k]=el.value;save('opps',o.id,{approvals:s})};
CHG.ninety=el=>{const p=S.progress[ME]||{};saveProgress({ninety:{...(p.ninety||{}),[el.dataset.id]:el.checked}})};
CHG.myrole=el=>{save('members',ME,{...(S.members[ME]||{}),role:el.value})};
CHG.myco=el=>{const m=S.members[ME]||{};const c=new Set(arr(m.companies));el.checked?c.add(el.dataset.id):c.delete(el.dataset.id);save('members',ME,{...m,companies:[...c]})};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(e.target.closest('[data-stop]'))return;if(!a||a.disabled)return;const fn=ACT[a.dataset.act];if(!fn)return;e.preventDefault();
  if(!['closeDrawer','dtab','openOrg','openOpp','closeForm','calToggle','setEd','exportCsv'].includes(a.dataset.act)&&!guardWrite())return;fn(a)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg]){if(!guardWrite())return;CHG[el.dataset.chg](el);return}
  const f=e.target.closest('[data-filter]');if(f)setF(f.dataset.filter,f.type==='checkbox'?f.checked:f.value)});
document.addEventListener('input',e=>{const f=e.target.closest('input[type=search][data-filter]');if(f)setF(f.dataset.filter,f.value)});
document.addEventListener('submit',e=>{if(e.target.id!=='theform')return;e.preventDefault();if(!guardWrite())return;const v=readForm();const miss=FORM.fields.filter(f=>f.req&&(v[f.k]===''||v[f.k]==null||v[f.k]===false)).map(f=>f.label);if(miss.length){toast('Fill in: '+miss.join(', '));return}const cb=FORM.onSave;closeForm();cb(v)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(FORM)closeForm();else if(UI.drawer){UI.drawer=null;schedule()}}});
/* drag & drop on pipeline */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const l=e.target.closest&&e.target.closest('[data-lane]');if(l){e.preventDefault();document.querySelectorAll('.lane.over').forEach(x=>x!==l&&x.classList.remove('over'));l.classList.add('over')}});
document.addEventListener('dragleave',e=>{const l=e.target.closest&&e.target.closest('[data-lane]');if(l&&!l.contains(e.relatedTarget))l.classList.remove('over')});
document.addEventListener('drop',e=>{const l=e.target.closest&&e.target.closest('[data-lane]');if(!l)return;e.preventDefault();l.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const o=S.opps[id];if(o&&+o.stage!==+l.dataset.lane&&guardWrite())setStage(o,+l.dataset.lane)});

/* routing */
function route(){const h=(location.hash||'').slice(1);UI.route=ROUTES.some(r=>r[0]===h)?h:'home';window.scrollTo(0,0);schedule()}
window.addEventListener('hashchange',route);

/* ===================== Boot ===================== */
async function boot(){route();
  if(!window.claude||!window.claude.use){offline=true;schedule();return}
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  if(user){try{ME=await user.id()}catch(e){}try{MYNAME=await user.name()}catch(e){}if(ME)NAMES[ME]=MYNAME}
  if(!db){offline=true;schedule();return}
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});S[c]=m;loaded[c]=true;
    if(c==='members'&&ME&&!S.members[ME]&&!boot.joined){boot.joined=true;save('members',ME,{role:'',companies:[],joined:new Date().toISOString()})}
    if(UI.drawer&&((UI.drawer.type==='org'&&c==='orgs')||(UI.drawer.type==='opp'&&c==='opps'))&&!S[c][UI.drawer.id])UI.drawer=null;
    schedule()},err=>{if(err&&(err.code==='not_granted'||err.code==='revoked')){offline=true;schedule()}}));
  schedule()}
boot();
</script>
